<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c73ff"/>
      <stop offset="60%" stop-color="#635bff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner Soft Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <g filter="url(#subtleShadow)">
    <!-- Wallet / Card Body -->
    <rect x="110" y="145" width="292" height="200" rx="36" fill="#ffffff"/>
    
    <!-- Top Card Layer / Header strip -->
    <path d="M 110 190 Q 110 145 155 145 L 357 145 Q 402 145 402 190 L 402 215 L 110 215 Z" fill="#eef2ff"/>

    <!-- Magnetic Strip / Chip Indicator -->
    <rect x="145" y="172" width="46" height="28" rx="8" fill="#635bff" opacity="0.85"/>
    <rect x="205" y="178" width="56" height="16" rx="6" fill="#c7d2fe"/>

    <!-- Circular Recurring Subscription Badge (bottom right) -->
    <circle cx="350" cy="315" r="70" fill="#ffffff" stroke="#f1f5f9" stroke-width="4"/>
    <circle cx="350" cy="315" r="58" fill="url(#accentGrad)"/>

    <!-- Recurring Arrows inside the badge -->
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper Arrow Arc -->
      <path d="M 328 305 A 24 24 0 0 1 368 297"/>
      <path d="M 364 286 L 372 297 L 361 306"/>
      
      <!-- Lower Arrow Arc -->
      <path d="M 372 325 A 24 24 0 0 1 332 333"/>
      <path d="M 336 344 L 328 333 L 339 324"/>
    </g>
  </g>
</svg>
