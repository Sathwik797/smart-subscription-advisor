<!-- Subscription Advisor Chatbot Partial -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}">

<!-- Floating Circular Launcher Button -->
<button
    id="chatbotLauncher"
    class="chatbot-launcher"
    type="button"
    aria-label="Open Smart Subscription Advisor"
    aria-expanded="false"
    aria-controls="chatbotPanel">
    <i class="bi bi-chat-dots-fill chatbot-icon-open" aria-hidden="true"></i>
    <i class="bi bi-x-lg chatbot-icon-close" aria-hidden="true"></i>
</button>

<!-- Compact Floating Chat Panel -->
<div
    id="chatbotPanel"
    class="chatbot-panel"
    role="dialog"
    aria-labelledby="chatbotTitle"
    aria-hidden="true"
    data-page="{{ chatbot_page | default('dashboard') }}">

    <!-- Chat Header -->
    <header class="chatbot-header">
        <div class="chatbot-header-info">
            <div class="chatbot-avatar" aria-hidden="true">
                <i class="bi bi-stars"></i>
            </div>
            <div>
                <h2 id="chatbotTitle" class="chatbot-title">Smart Subscription Advisor</h2>
                <p class="chatbot-subtitle">Your personal subscription assistant</p>
            </div>
        </div>
        <button
            id="chatbotClose"
            class="chatbot-close-btn"
            type="button"
            aria-label="Close Smart Subscription Advisor">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
    </header>

    <!-- Chat Messages Scroll Container -->
    <div id="chatbotMessages" class="chatbot-messages" aria-live="polite" aria-relevant="additions">
        <!-- Messages dynamically inserted here via safe textContent DOM nodes -->
    </div>

    <!-- Clickable Suggestion Chips Container -->
    <div id="chatbotSuggestions" class="chatbot-suggestions" aria-label="Suggested questions">
        <!-- Chips populated by page context dynamically -->
    </div>

    <!-- Chat Input Form -->
    <form id="chatbotForm" class="chatbot-form" autocomplete="off">
        <div class="chatbot-input-wrapper">
            <textarea
                id="chatbotInput"
                class="chatbot-input"
                placeholder="Ask about your subscriptions..."
                rows="1"
                maxlength="2000"
                aria-label="Ask about your subscriptions"></textarea>
            <button
                id="chatbotSend"
                class="chatbot-send-btn"
                type="submit"
                aria-label="Send question"
                disabled>
                <i class="bi bi-arrow-up-short" aria-hidden="true"></i>
            </button>
        </div>
    </form>
</div>

<script src="{{ url_for('static', filename='js/chatbot.js') }}" defer></script>
